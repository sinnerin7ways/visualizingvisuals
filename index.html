<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visuals: Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Visuals">
    <link rel="manifest" href="assets/favicon/site.webmanifest">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="header">
  <a href="/" class="title">Visualizing Visuals</a>
  <div class="menu-wrap">
    <img src="/assets/favicon/vv-ico.png" alt="Menu" class="menu-btn">
    <div class="dropdown">
      <a href="/">Home</a>
      <a href="/about/">About</a>
      <a href="/contact-shop/">Contact & Shop</a>
      <a href="/p5-projects/">p5js Projects</a>
      <a href="/videos">Videos</a>
    </div>
  </div>
</header>
<main>
  <h1 class="page-title">Home</h1>
  <section class="page-text">
    <p>Welcome to the site of sights to be seen.</p>
  </section>
  <div style="display:flex; flex-wrap:wrap; justify-content:center; gap: min(6vw, 40px); padding: 0 10px; padding-top: 10px;">
    <a href="p5-projects/" class="project-link">
      <img src="assets/page-icons/p5js-icon.png" alt="p5js projects">
      <span>p5js Projects</span>
    </a>
    <a href="videos/" class="project-link">
      <img src="assets/page-icons/videos-icon.png" alt="Videos">
      <span>Videos</span>
    </a>
    <a href="contact-shop/" class="project-link">
      <img src="assets/page-icons/contact-icon.png" alt="Contact">
      <span>Contact & Shop</span>
    </a>
  </div>
  <div id="canvas-container"></div>
</main>
<div class="bottom-spacer"></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.querySelector(".menu-btn");
  const menu = document.querySelector(".dropdown");
  btn.onclick = e => {
    e.stopPropagation();
    menu.classList.toggle("active");
  };
  document.onclick = e => {
    if (!menu.contains(e.target) && !btn.contains(e.target)) {
      menu.classList.remove("active");
    }
  };
});
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="action.js"></script>
</body>
</html>
