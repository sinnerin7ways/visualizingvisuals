<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VV: Drop Sticks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="VV: Drop Sticks">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
    <header>
        <h1><a href="../">Visualizing Visuals: Drop Sticks</a></h1>
        <img src="../assets/favicon/vv-ico.png">
    </header>
    <p id="message">Drop sticks on a canvas.</p>
    <div id="canvas-container"></div>
    <div id="img-controls">
        <button id="savePNG" type="button">Save PNG</button>
        <p>Number of Sticks:</p>
        <input type="range" id="stickNum" min="1" max="100" value="10" oninput="updateFromControls()">
        <p>Background Color:</p>
        <label for="bgRed">Red</label>
        <input type="range" id="bgRed" min="0" max="255" value="100" oninput="updateFromControls()">
        <label for="bgGreen">Green</label>
        <input type="range" id="bgGreen" min="0" max="255" value="100" oninput="updateFromControls()">
        <label for="bgBlue">Blue</label>
        <input type="range" id="bgBlue" min="0" max="255" value="100" oninput="updateFromControls()">
        <p>Stroke Color:</p>
        <label for="fgRed">Red</label>
        <input type="range" id="fgRed" min="0" max="255" value="255" oninput="updateFromControls()">
        <label for="fgGreen">Green</label>
        <input type="range" id="fgGreen" min="0" max="255" value="255" oninput="updateFromControls()">
        <label for="fgBlue">Blue</label>
        <input type="range" id="fgBlue" min="0" max="255" value="255" oninput="updateFromControls()">
    </div>
    <div class="bottom-spacer"></div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="action.js"></script>
</body>
</html>
