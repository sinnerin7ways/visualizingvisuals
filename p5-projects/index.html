<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Visuals: p5js Projects</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Coming+Soon&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="../assets/favicon/favicon-96x96.png" sizes="96x96">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/favicon.svg">
    <link rel="shortcut icon" href="../assets/favicon/favicon.ico">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/favicon/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-title" content="Visuals">
    <link rel="manifest" href="../assets/favicon/site.webmanifest">
    <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header class="header">
  <a href="/" class="title">Visualizing Visuals</a>
  <div class="menu-wrap">
    <img src="/assets/favicon/vv-ico.png" alt="Menu" class="menu-btn">
    <div class="dropdown">
      <a href="../">Home</a>
      <a href="/contact-shop/">Contact & Shop</a>
      <a href="/p5-projects/">p5js Projects</a>
      <a href="/videos">Videos</a>
    </div>
  </div>
</header>
<main>
  <h1 class="page-title">p5Js Projects</h1>
  <section class="page-text">
    <p>An assortment of ideas implemented in Javascript using the p5 library.</p>
  </section>
  <div style="display:flex; flex-wrap:wrap; justify-content:center; gap: min(6vw, 40px); padding: 0 10px; padding-top: 10px;">
    <a href="time-tank/" class="project-link">
      <img src="canvas-icons/time-tank-ico.png" alt="Time Tank">
      <span>Time Tank</span>
    </a>
    <a href="perlin-map/" class="project-link">
      <img src="canvas-icons/perlin-map_ico.png" alt="Perlin Map">
      <span>Perlin Map</span>
    </a>
    <a href="drop-sticks/" class="project-link">
      <img src="canvas-icons/drop-sticks_ico.png" alt="Drop Sticks">
      <span>Drop Sticks</span>
    </a>
    <a href="mood-painting/" class="project-link">
      <img src="canvas-icons/mood-painting_ico.png" alt="Mood Painting">
      <span>Mood Painting</span>
    </a>
    <a href="prophetic-pool-ball/" class="project-link">
      <img src="canvas-icons/pool-ball-ico.png" alt="Prophetic Pool Ball">
      <span>Prophetic Pool Ball</span>
    </a>
    <a href="draw-powerball/" class="project-link">
      <img src="canvas-icons/powerball_ico.png" alt="Draw Powerball">
      <span>Draw Powerball</span>
    </a>
    <a href="heads-tails/" class="project-link">
      <img src="canvas-icons/coin.png" alt="Heads or Tails?">
      <span>Heads or Tails?</span>
    </a>
    <a href="bug-walk/" class="project-link">
      <img src="canvas-icons/bug-walk-ico.png" alt="Bug Walk">
      <span>Bug Walk</span>
    </a>
  </div>
</main>
<div class="bottom-spacer"></div>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.querySelector(".menu-btn");
  const menu = document.querySelector(".dropdown");
  btn.onclick = e => {
    e.stopPropagation();
    menu.classList.toggle("active");
  };
  document.onclick = e => {
    if (!menu.contains(e.target) && !btn.contains(e.target)) {
      menu.classList.remove("active");
    }
  };
});
</script>
</body>
</html>
